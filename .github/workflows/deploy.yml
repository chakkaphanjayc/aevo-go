name: Aevo Go Cloudflare Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Cloudflare environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '') }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Build with the target authentication boundary
        env:
          VITE_APP_ENV: ${{ inputs.environment == 'production' && 'production' || 'staging' }}
          VITE_ACCOUNTS_URL: ${{ vars.AEVO_ACCOUNTS_URL }}
        run: bun run build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
